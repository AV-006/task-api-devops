server:
  port: ${APP_PORT:8080}

app:
  name: Task API
  version: ${APP_VERSION:1.0.0}
  environment: ${APP_ENV:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
