- name: Install Java runtime
  ansible.builtin.apt:
    name: "{{ java_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create service group
  ansible.builtin.group:
    name: "{{ app_group }}"
    system: true
    state: present

- name: Create service user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'

- name: Copy executable JAR
  ansible.builtin.copy:
    src: "{{ app_jar_src }}"
    dest: "{{ app_dir }}/task-api.jar"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'
  notify: Restart Task API

- name: Install systemd unit
  ansible.builtin.template:
    src: task-api.service.j2
    dest: /etc/systemd/system/task-api.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Task API

- name: Enable and start Task API
  ansible.builtin.systemd_service:
    name: task-api
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts before health check
  ansible.builtin.meta: flush_handlers

- name: Wait until the application health endpoint is ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/actuator/health"
    method: GET
    status_code: 200
    return_content: true
  register: task_api_health
  retries: 40
  delay: 3
  until: task_api_health.status == 200 and task_api_health.json.status == 'UP'
